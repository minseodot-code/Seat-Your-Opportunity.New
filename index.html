    const calculateResult = (userAnswers) => {
      const scores = { VISION: 0, FOCUS: 0, ACTION: 0, CONNECT: 0 };
      userAnswers.forEach((type) => { scores[type] = (scores[type] || 0) + 1; });

      let maxScore = -1;
      let winner = 'ACTION';

      Object.keys(scores).forEach((type) => {
        if (scores[type] > maxScore) {
          maxScore = scores[type];
          winner = type;
        } else if (scores[type] === maxScore) {
          const q7Answer = userAnswers[6];
          const q6Answer = userAnswers[5];
          if (type === q7Answer || type === q6Answer) {
            winner = type;
          }
        }
      });
      return winner;
    };

        return false;
      }

      try {
        const formData = new URLSearchParams();
        formData.append(GOOGLE_FORM_CONFIG.entries.nickname, data.nickname || 'GUEST');
        formData.append(GOOGLE_FORM_CONFIG.entries.resultType, data.result_type || 'VISION');
        formData.append(GOOGLE_FORM_CONFIG.entries.rating, String(data.rating || 5));
        formData.append(GOOGLE_FORM_CONFIG.entries.comment, data.comment || '');

        await fetch(GOOGLE_FORM_CONFIG.formUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: formData.toString()
        });

        console.log('[Google Form] 구글 폼 실시간 전송 완료');
        return true;
      } catch (err) {
        console.warn('[Google Form] 전송 예외 발생:', err);
        return false;
      }

    const saveFeedback = async (data) => {
      const item = {
        id: `fb_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`,
        nickname: data.nickname || 'GUEST',
        result_type: data.result_type || 'VISION',
        rating: Number(data.rating) || 5,
        comment: data.comment ? String(data.comment).trim() : '',
        created_at: new Date().toISOString()
      };

      sendFeedbackToGoogleForm(item).catch((e) => console.warn('Google Form send warning:', e));

      if (typeof window !== 'undefined' && window.supabaseClient) {
        try {
          const { error } = await window.supabaseClient.from('feedbacks').insert([item]);
          if (!error) {
            saveFeedbackToLocalStorage(item);
            return item;
          }
        } catch (e) {
          console.warn('Supabase save error, fallback to LocalStorage:', e);
        }
      }

      saveFeedbackToLocalStorage(item);
      return item;
    };

        const existing = JSON.parse(localStorage.getItem('seat_your_opportunity_feedbacks') || '[]');

    const getFeedbacks = () => {

        return JSON.parse(localStorage.getItem('seat_your_opportunity_feedbacks') || '[]');
      } catch (err) {
        return [];
      }
    };

    const clearFeedbacks = () => {
      try {
        localStorage.removeItem('seat_your_opportunity_feedbacks');
      } catch (err) {
        console.error('LocalStorage clear error:', err);
      }
    };

    const exportFeedbacksToCSV = (feedbacks) => {
      if (!feedbacks || feedbacks.length === 0) return;
      const headers = ['ID', '닉네임', '결과 유형', '별점(1-5)', '의견/피드백', '제출시간'];
      const rows = feedbacks.map((f) => [
        f.id,
        `"${(f.nickname || '').replace(/"/g, '""')}"`,
        f.result_type,
        f.rating,
        `"${(f.comment || '').replace(/"/g, '""')}"`,
        f.created_at
      ]);

      const csvContent = '\uFEFF' + [headers.join(','), ...rows.map((r) => r.join(','))].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `career_cafe_feedbacks_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    };

    const generateCardImage = async (element) => {
      if (typeof window !== 'undefined' && window.htmlToImage && window.htmlToImage.toPng) {
        return await window.htmlToImage.toPng(element, { quality: 0.95, backgroundColor: '#ffffff', cacheBust: true });
      }

      const width = 360;
      const height = element.offsetHeight || 650;
      const cloned = element.cloneNode(true);
      
      const svgString = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
          <foreignObject width="100%" height="100%">
            <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: sans-serif; background: #ffffff; padding: 10px;">
              ${cloned.outerHTML}
            </div>
          </foreignObject>
        </svg>
      `;

      const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = width * 2;
          canvas.height = height * 2;
          const ctx = canvas.getContext('2d');
          ctx.scale(2, 2);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          resolve(null);
        };
        img.src = url;
      });
    };

    function CareerCafeApp() {
      const [screen, setScreen] = useState('intro');
      const [nickname, setNickname] = useState('');
      const [nicknameError, setNicknameError] = useState('');

      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [answers, setAnswers] = useState([]);
      const [finalResult, setFinalResult] = useState(null);

      const [loadingProgress, setLoadingProgress] = useState(0);
      const [loadingPhraseIndex, setLoadingPhraseIndex] = useState(0);

      const [showMissionModal, setShowMissionModal] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      // Mandatory Feedback Gating State
      const [feedbackRating, setFeedbackRating] = useState(0);
      const [feedbackComment, setFeedbackComment] = useState('');
      const [isFeedbackSubmitted, setIsFeedbackSubmitted] = useState(false);
      const feedbackSectionRef = useRef(null);

      const [showAdminModal, setShowAdminModal] = useState(false);
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [adminPassword, setAdminPassword] = useState('');
      const [passwordError, setPasswordError] = useState('');
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [headerClickCount, setHeaderClickCount] = useState(0);
      const [adminFeedbacks, setAdminFeedbacks] = useState([]);

      const cardRef = useRef(null);
      const charmRef = useRef(null);
      const summaryCardRef = useRef(null);
      const [isSavingCard, setIsSavingCard] = useState(false);
      const [isSavingCharm, setIsSavingCharm] = useState(false);

      const triggerToast = (msg) => {

        setTimeout(() => setToastMessage(null), 3200);

      const handleAdminClick = () => {
        if (isAdminAuthenticated) {

          setPasswordError('');
          setShowPasswordModal(true);
        }
      };

      const handlePasswordSubmit = (e) => {
        if (e) e.preventDefault();
        if (adminPassword.trim() === '0621') {

          setAdminPassword('');
          setPasswordError('');
          openAdminDashboard();
        } else {
          setPasswordError('비밀번호가 올바르지 않습니다. (운영진 전용)');

      const handleStartIntro = () => {

        setScreen('quiz');
      };

      const handleSelectOption = (selectedType) => {
        const question = QUESTIONS[currentQIndex];
        const newAnswers = [
          ...answers.filter((a) => a.questionId !== question.id),
          { questionId: question.id, selectedType: selectedType }
        ];
        setAnswers(newAnswers);

        if (currentQIndex < QUESTIONS.length - 1) {
          setTimeout(() => {
            setCurrentQIndex((prev) => prev + 1);
          }, 200);
        } else {
          setTimeout(() => {
            calculateAndNavigateResult(newAnswers);
          }, 250);

      };

      const calculateAndNavigateResult = (allAnswers) => {
        setScreen('loading');

        const answerTypesSequence = QUESTIONS.map((q) => {
          const found = allAnswers.find((a) => a.questionId === q.id);
          return found ? found.selectedType : 'VISION';
        });

        const winnerType = calculateResult(answerTypesSequence);
        const calculatedResult = RESULT_TYPES[winnerType] || RESULT_TYPES.VISION;
        setFinalResult(calculatedResult);
      };

      useEffect(() => {
        if (screen === 'loading') {
          setLoadingProgress(0);
          setLoadingPhraseIndex(0);

          const progressInterval = setInterval(() => {
            setLoadingProgress((prev) => {
              if (prev >= 100) {
                clearInterval(progressInterval);
                return 100;
              }
              return prev + 4;
            });
          }, 80);

          const phraseInterval = setInterval(() => {
            setLoadingPhraseIndex((prev) => (prev + 1) % 2);
          }, 1000);

          const timer = setTimeout(() => {
            setScreen('result');
          }, 2400);

          return () => {
            clearInterval(progressInterval);
            clearInterval(phraseInterval);
            clearTimeout(timer);
          };
        }
      }, [screen]);

      useEffect(() => {
        if (typeof window !== 'undefined') {
          const isAdminRoute =
            window.location.pathname.includes('/admin') ||
            window.location.hash === '#admin' ||
            window.location.search.includes('admin=true');

      const handleSubmitFeedback = async () => {
        if (isFeedbackSubmitted) return;

        if (feedbackRating === 0 || feedbackComment.trim().length < 2) {

            throw new Error('Image generation failed');
          }
        } catch (err) {
          console.error('Failed to download receipt image:', err);
          triggerToast('이미지 저장 중 오류가 발생했습니다. 화면을 직접 캡처해 주세요!');

          setIsSavingCard(false);
        }
      };

      const handleSaveCharmImage = async () => {

        setIsSavingCharm(true);

        try {
          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }

          const imgElements = charmRef.current?.querySelectorAll('img');
          if (imgElements && imgElements.length > 0) {
            await Promise.all(
              Array.from(imgElements).map(
                (img) =>
                  new Promise((resolve) => {
                    if (img.complete) resolve(true);
                    else img.onload = img.onerror = () => resolve(true);
                  })
              )
            );
          }

          let dataUrl = null;
          if (typeof window !== 'undefined' && window.html2canvas) {
            const canvas = await window.html2canvas(charmRef.current, {
              scale: 2,
              useCORS: true,
              allowTaint: true,
              backgroundColor: '#FFFFFF',
              logging: false
            });
            dataUrl = canvas.toDataURL('image/png');
          } else {
            dataUrl = await generateCardImage(charmRef.current);
          }

          if (dataUrl) {
            const link = document.createElement('a');
            const formattedName = (nickname || 'MY_TYPE').replace(/\s+/g, '_');
            link.download = `SEAT_YOUR_OPPORTUNITY_LUCKY_CHARM_${formattedName}.png`;
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            triggerToast('🍀 커리어 행운 부적 이미지가 성공적으로 저장되었습니다!');
          } else {
            throw new Error('Charm image generation failed');
          }
        } catch (err) {
          console.error('Charm download error:', err);
          triggerToast('부적 이미지 저장 중 오류가 발생했습니다. 화면을 캡처해 주세요!');
        } finally {
          setIsSavingCharm(false);
        }
      };



      const LOADING_PHRASES = [
        "당신에게 가장 잘 맞는 자리를 찾고 있어요...",
        "선택한 답변에서 커리어 강점을 발견하는 중..."
      ];

      const calcAvgRating = () => {
        if (!adminFeedbacks || adminFeedbacks.length === 0) return '0.0';
        const sum = adminFeedbacks.reduce((acc, curr) => acc + (curr.rating || 0), 0);
        return (sum / adminFeedbacks.length).toFixed(1);
      };

      const calcTypeCounts = () => {
        const counts = { VISION: 0, FOCUS: 0, ACTION: 0, CONNECT: 0 };
        adminFeedbacks.forEach((f) => {
          if (counts[f.result_type] !== undefined) {
            counts[f.result_type] += 1;
          }
        });
        return counts;
      };

      const resData = finalResult || RESULT_TYPES.ACTION || RESULT_TYPES.VISION;
      const preferredEnvList = Array.isArray(resData?.preferredEnvironment)
        ? resData.preferredEnvironment
        : (resData?.environment ? [resData.environment] : []);
      const tagsList = Array.isArray(resData?.tags) ? resData.tags : [];
      const questionCardObj = resData?.seniorQuestionCard || {
        question: '새 아이디어를 실제 업무에 반영할 때 가장 중요한 기준은?',
        tip: '기업의 미래 성장 전략과 창의적 비전 결합 가능성을 확인하세요.'
      };

      return (
        <div className="min-h-screen bg-[#FAF7F2] text-[#1E3A2B] font-sans flex items-center justify-center p-3 sm:p-6 antialiased select-none">
          {toastMessage && (
            <div className="fixed top-5 z-50 px-5 py-3 rounded-full bg-[#007042] text-white text-xs sm:text-sm font-bold shadow-2xl border border-emerald-300 animate-bounce text-center">
              {toastMessage}

          )}

          <div className="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-emerald-950/10 overflow-hidden border border-emerald-200/80 relative h-[90vh] max-h-[800px] min-h-[660px] flex flex-col justify-between">
            
            {/* SCREEN 1: INTRO */}
            {screen === 'intro' && (
              <div className="flex-1 flex flex-col justify-between p-6 bg-gradient-to-b from-[#FFFDF9] via-[#FAF7F2] to-[#E0F2F1]/30 text-center relative">
                
                {/* Top Right Official Branding Logo: JA Korea */}
                <div className="absolute top-4 right-4 flex items-center gap-1.5 opacity-90 z-10">
                  <img 
                    src="/images/ja-korea-logo.png" 
                    alt="JA Korea Logo" 
                    className="h-6 object-contain"
                    onError={(e) => { e.currentTarget.style.display = 'none'; }}
                  />
                  <span className="text-[11px] font-extrabold text-[#007042] bg-white/90 px-2 py-0.5 rounded-full border border-emerald-200 shadow-2xs">

                {/* Central Hero Coffee Image Container */}
                <div className="my-auto py-4 flex flex-col items-center justify-center">

                <div className="pb-2">
                  <button

                    className="w-full py-4 px-6 rounded-2xl bg-[#007042] hover:bg-[#1E3A2B] text-white font-bold text-base shadow-lg shadow-emerald-950/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2"

                    <span>테스트 시작하기</span>
                    <span>➔</span>
                  </button>
                </div>

            )}

            {/* SCREEN 2: NICKNAME */}
            {screen === 'nickname' && (
              <div className="flex-1 flex flex-col justify-between p-6 bg-[#FFFDF9]">
                <div className="pt-4">

                  </h2>
                  <p className="text-xs text-stone-600 leading-relaxed font-medium">

                  </p>
                </div>

                <form onSubmit={handleNicknameSubmit} className="my-auto space-y-4">
                  <div className="space-y-2">
                    <label className="block text-xs font-bold text-[#007042]">
                      닉네임 (최대 8자)
                    </label>
                    <div className="relative">
                      <input
                        type="text"
                        value={nickname}
                        onChange={(e) => {
                          setNickname(e.target.value);
                          if (nicknameError) setNicknameError('');
                        }}
                        placeholder="예: 커피마니아"
                        maxLength={8}
                        className={`w-full px-4 py-3.5 rounded-xl border ${
                          nicknameError ? 'border-red-400 bg-red-50/50' : 'border-emerald-200 bg-white'
                        } focus:outline-none focus:ring-2 focus:ring-[#007042] text-sm text-[#1E3A2B] font-medium shadow-xs transition-all`}
                        autoFocus
                      />
                      <span className="absolute right-3 top-3.5 text-xs text-stone-400 font-mono">
                        {nickname.length}/8
                      </span>
                    </div>
                    {nicknameError && (
                      <p className="text-xs font-semibold text-red-500 flex items-center gap-1">
                        <span>⚠️</span> {nicknameError}
                      </p>
                    )}
                  </div>
                </form>

                <div className="pb-2">
                  <button
                    onClick={handleNicknameSubmit}
                    disabled={!nickname.trim()}
                    className={`w-full py-4 px-6 rounded-2xl font-bold text-sm shadow-md transition-all flex items-center justify-center gap-2 ${
                      nickname.trim()
                        ? 'bg-[#007042] hover:bg-[#1E3A2B] text-white active:scale-[0.98]'
                        : 'bg-stone-200 text-stone-400 cursor-not-allowed'

                  >
                    <span>나의 지정석 찾으러 가기</span>
                    <span>➔</span>
                  </button>
                </div>
              </div>
            )}

            {/* SCREEN 3: QUIZ */}
            {screen === 'quiz' && (
              <div className="flex-1 flex flex-col justify-between p-5 sm:p-6 bg-[#FFFDF9]">
                <div>
                  <div className="flex items-center justify-between text-xs font-bold text-[#007042] mb-2">
                    <span className="flex items-center gap-1.5">
                      <span className="text-base">☕</span>
                      <span>{currentQIndex + 1} / {QUESTIONS.length} 문항 진행 중...</span>
                    </span>
                    <span className="text-[#007042] font-black">
                      {Math.round(((currentQIndex + 1) / QUESTIONS.length) * 100)}%
                    </span>
                  </div>

                      )}
                    </div>

                    <button
                      type="button"
                      disabled={isFeedbackSubmitted || feedbackRating === 0 || feedbackComment.trim().length < 2}
                      onClick={handleSubmitFeedback}
                      className={`w-full py-3 px-4 rounded-xl text-xs font-bold transition-all shadow-xs flex items-center justify-center gap-1.5 ${
                        isFeedbackSubmitted
                          ? 'bg-stone-200 text-stone-500 cursor-not-allowed'
                          : (feedbackRating > 0 && feedbackComment.trim().length >= 2)
                          ? 'bg-[#007042] hover:bg-[#1E3A2B] text-white active:scale-[0.98] shadow-md'
                          : 'bg-stone-200 text-stone-400 cursor-not-allowed'
                      }`}
                    >
                      <span>
                        {isFeedbackSubmitted
                          ? '✅ 제출 완료 (영수증 확인 및 저장 해제됨)'
                          : (feedbackRating > 0 && feedbackComment.trim().length >= 2)
                          ? '영수증 확인 및 저장하러 가기 ➔'
                          : '별점과 한줄 피드백 작성 시 영수증 해제'}
                      </span>
                    </button>
                  </div>

                  <div className="h-2" />
                </div>

                {/* 2. Sticky Action Buttons Footer Bar */}
                <div className="p-3.5 sm:p-4 bg-white/95 backdrop-blur-md border-t border-emerald-200/80 shrink-0 space-y-2 shadow-lg z-20 sticky bottom-0">
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={handleSaveResult}
                      disabled={isSavingCard}
                      className={`py-3 px-3 rounded-xl text-xs font-bold shadow-md transition-all flex items-center justify-center gap-1.5 ${
                        !isFeedbackSubmitted
                          ? 'bg-stone-300 text-stone-600 cursor-pointer'
                          : isSavingCard
                          ? 'bg-[#007042] text-white opacity-80 cursor-wait'
                          : 'bg-[#007042] hover:bg-[#1E3A2B] text-white active:scale-[0.98]'
                      }`}
                    >
                      {isSavingCard ? (
                        <>
                          <span className="animate-spin">⏳</span>
                          <span>영수증 생성 중...</span>
                        </>
                      ) : (
                        <>
                          <span>{isFeedbackSubmitted ? '📥' : '🔒'}</span>
                          <span>{isFeedbackSubmitted ? '영수증 이미지 저장' : '피드백 작성후 저장'}</span>
                        </>
                      )}
                    </button>

                    <button
                      onClick={handleOpenMissionModal}
                      className={`py-3 px-3 rounded-xl text-xs font-bold shadow-md transition-all flex items-center justify-center gap-1.5 ${
                        !isFeedbackSubmitted
                          ? 'bg-stone-300 text-stone-600 cursor-pointer'
                          : 'bg-emerald-700 hover:bg-emerald-800 text-white active:scale-[0.98]'
                      }`}
                    >
                      <span>{isFeedbackSubmitted ? '🎟️' : '🔒'}</span>
                      <span>{isFeedbackSubmitted ? '오늘의 미션 & 행운 부적' : '피드백 작성후 미션'}</span>
                    </button>
                  </div>

                  <div className="flex gap-2">
                    <button
                      onClick={handleReset}
                      className={`flex-1 py-2.5 px-4 rounded-xl text-xs font-bold border transition-all flex items-center justify-center gap-1.5 ${
                        !isFeedbackSubmitted
                          ? 'bg-stone-200 text-stone-400 border-stone-300 opacity-70 cursor-pointer'
                          : 'bg-emerald-50/60 text-stone-700 border-emerald-200 hover:bg-emerald-100/60 active:scale-[0.98]'
                      }`}
                    >
                      <span>{isFeedbackSubmitted ? '🔄' : '🔒'}</span>
                      <span>{isFeedbackSubmitted ? '테스트 다시 하기' : '피드백 작성후 다시하기'}</span>
                    </button>
                    
                    <button
                      onClick={handleAdminClick}
                      className="py-2.5 px-3 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-600 text-xs font-bold border border-stone-300 transition-all flex items-center justify-center"
                      title="부스 관리자 현황"
                    >
                      <span>⚙️</span>
                    </button>
                  </div>
                </div>

                {/* Admin Password Authentication Modal */}
                {showPasswordModal && (
                  <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl border border-stone-300 space-y-4 text-center">
                      <div className="flex items-center justify-between border-b pb-3">
                        <h4 className="text-sm font-black text-[#007042] flex items-center gap-1.5">
                          <span>🔒</span> <span>관리자 인증</span>
                        </h4>
                        <button
                          onClick={() => setShowPasswordModal(false)}
                          className="text-stone-400 hover:text-stone-600 text-sm font-bold"
                        >
                          ✕
                        </button>
                      </div>

                      <div className="space-y-3 text-left">
                        <p className="text-xs text-stone-600 font-medium leading-relaxed">
                          현장 운영진 전용입니다. 비밀번호를 입력해 주세요.
                        </p>
                        
                        <form onSubmit={handlePasswordSubmit} className="space-y-3 pt-1">
                          <input
                            type="password"
                            value={adminPassword}
                            onChange={(e) => {
                              setAdminPassword(e.target.value);
                              if (passwordError) setPasswordError('');
                            }}
                            placeholder="비밀번호 입력"
                            autoFocus
                            className="w-full p-3 rounded-xl border border-stone-300 text-sm font-mono text-center tracking-widest focus:outline-none focus:ring-2 focus:ring-[#007042]"
                          />
                          
                          {passwordError && (
                            <p className="text-[11px] text-red-500 font-bold text-center animate-pulse">
                              {passwordError}
                            </p>
                          )}

                          <button
                            type="submit"
                            className="w-full py-3 px-4 rounded-xl bg-[#007042] hover:bg-[#1E3A2B] text-white text-xs font-bold transition-all shadow-md active:scale-[0.98]"
                          >
                            인증 확인
                          </button>
                        </form>
                      </div>
                    </div>
                  </div>
                )}

                {/* Today's Job Fair Mission & Lucky Charm Modal */}
                {showMissionModal && (
                  <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
                    <div className="relative w-full max-w-sm max-h-[85vh] bg-[#FAF7F2] rounded-3xl shadow-2xl border-2 border-emerald-400 flex flex-col overflow-hidden text-left">
                      
                      {/* Fixed Header (shrink-0) */}
                      <div className="p-4 bg-white border-b border-emerald-200 flex items-center justify-between shrink-0">
                        <h4 className="text-sm font-black text-[#007042] flex items-center gap-1.5">
                          <span>🍀</span> <span>{nickname || 'GUEST'}님의 커리어 행운 부적</span>
                        </h4>
                        <button
                          onClick={() => setShowMissionModal(false)}
                          className="text-stone-400 hover:text-stone-600 text-sm font-bold p-1 rounded-lg hover:bg-stone-100 transition-all"
                        >
                          ✕
                        </button>
                      </div>

                      {/* Scrollable Body (Scrollbar strictly contained inside) */}
                      <div className="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-thin scrollbar-thumb-emerald-300">
                        {/* Lucky Charm Card (Captured for Image Export with charmRef) */}
                        <div
                          ref={charmRef}
                          className="bg-white p-4 rounded-2xl border-2 border-amber-300 shadow-lg text-center space-y-3 relative overflow-hidden"
                        >
                          <div className="inline-block px-3 py-1 rounded-full bg-amber-100 text-amber-900 text-xs font-black border border-amber-300 mb-1">
                            ✨ CAREER LUCKY CHARM 2026
                          </div>

                          {/* Prominent 부적 Image Display */}
                          <div className="w-44 h-56 mx-auto rounded-2xl overflow-hidden border-2 border-amber-400 shadow-md relative group bg-gradient-to-b from-amber-50 to-orange-50 flex items-center justify-center p-1">
                            <img
                              src="/images/부적.png"
                              alt="커리어 행운의 부적"
                              crossOrigin="anonymous"
                              className="w-full h-full object-contain drop-shadow-md rounded-xl p-1"
                              onError={(e) => {
                                const target = e.currentTarget;
                                if (!target.dataset.tried) {
                                  target.dataset.tried = "1";
                                  target.src = "/images/charm.png";
                                } else if (target.dataset.tried === "1") {
                                  target.dataset.tried = "2";
                                  target.src = "/images/부적.jpg";
                                } else if (target.dataset.tried === "2") {
                                  target.dataset.tried = "3";
                                  target.src = "/images/charm.jpg";
                                } else if (target.dataset.tried === "3") {
                                  target.dataset.tried = "4";
                                  if (typeof window !== 'undefined' && window.CHARM_BASE64) {
                                    target.src = window.CHARM_BASE64;
                                  } else {
                                    target.src = "charm.png";
                                  }
                                }
                              }}
                            />
                          </div>

                          <div>
                            <h5 className="text-sm font-black text-stone-900 leading-snug">
                              {nickname || 'GUEST'} 님의 [{resData.seatName || '커리어 지정석'}] 행운 부적
                            </h5>
                            <p className="text-xs font-bold text-[#007042] mt-1.5 px-2 leading-relaxed bg-emerald-50 py-2 rounded-xl border border-emerald-200">
                              {resData.id === 'VISION' && "🌟 당신의 독창적인 비전과 창의적인 도전이 밝은 미래의 길을 엽니다!"}
                              {resData.id === 'FOCUS' && "📚 당신의 탁월한 몰입과 세심한 완성도가 최고의 기회를 끌어당깁니다!"}
                              {resData.id === 'ACTION' && "⚡ 당신의 막힘없는 스피드와 강한 실행력이 목표를 성공으로 이끕니다!"}
                              {resData.id === 'CONNECT' && "🤝 당신의 따뜻한 소통과 연대의 힘이 더 큰 성장의 기회를 만듭니다!"}
                            </p>
                          </div>

                          <div className="text-[10px] text-stone-400 font-mono border-t border-stone-200 pt-2">
                            SEAT YOUR OPPORTUNITY • JA KOREA x JOB FAIR 2026
                          </div>
                        </div>

                        {/* Job Fair Mission & Question Card */}
                        <div className="space-y-2.5 text-xs">
                          <div className="p-3 bg-emerald-50 rounded-xl border border-emerald-200">
                            <span className="font-bold text-[#007042] block mb-1">
                              🎯 1. 오늘의 잡페어 추천 미션
                            </span>
                            <p className="text-stone-800 font-medium">{resData.jobFairMission || '부스 현직자와 대화 나누기'}</p>
                          </div>

                          <div className="p-3 bg-white rounded-xl border border-stone-300">
                            <span className="font-bold text-stone-900 block mb-1">
                              💬 2. 현직자 멘토 추천 질문
                            </span>
                            <p className="text-stone-800 font-semibold">
                              "{questionCardObj.question}"
                            </p>
                          </div>
                        </div>
                      </div>

                      {/* Fixed Footer (shrink-0) */}
                      <div className="p-4 bg-white border-t border-emerald-200 shrink-0 space-y-2">
                        <button
                          onClick={handleSaveCharmImage}
                          disabled={isSavingCharm}
                          className="w-full py-3 px-4 rounded-xl bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-white text-xs font-bold shadow-md transition-all flex items-center justify-center gap-1.5"
                        >
                          {isSavingCharm ? (
                            <>
                              <span className="animate-spin">⏳</span>
                              <span>부적 저장 중...</span>
                            </>
                          ) : (
                            <>
                              <span>🍀</span>
                              <span>행운 부적 이미지 저장하기</span>
                            </>
                          )}
                        </button>

                        <button
                          onClick={() => setShowMissionModal(false)}
                          className="w-full py-2 rounded-xl bg-stone-200 hover:bg-stone-300 text-stone-700 text-xs font-bold transition-all"
                        >
                          확인 완료
                        </button>
                      </div>

                    </div>
                  </div>
                )}

                {/* Secret Booth Manager Admin Modal */}
                {showAdminModal && (
                  <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl p-5 w-full max-w-md shadow-2xl border border-emerald-400 space-y-4 text-left max-h-[85vh] flex flex-col">
                      
                      <div className="flex items-center justify-between border-b pb-3 shrink-0">
                        <div className="flex items-center gap-2">
                          <span className="text-lg">📊</span>
                          <h4 className="text-sm font-black text-[#007042]">
                            부스 관리자 피드백 Dashboard
                          </h4>
                        </div>
                        <button
                          onClick={() => setShowAdminModal(false)}
                          className="text-stone-400 hover:text-stone-600 text-sm font-bold"
                        >
                          ✕
                        </button>
                      </div>

                      <div className="grid grid-cols-2 gap-2 shrink-0">
                        <div className="p-3 bg-emerald-50 rounded-xl border border-emerald-200 text-center">
                          <div className="text-[10px] text-stone-500 font-bold">총 제출 피드백</div>
                          <div className="text-xl font-black text-[#007042]">{adminFeedbacks.length} 건</div>
                        </div>
                        <div className="p-3 bg-teal-50 rounded-xl border border-teal-200 text-center">
                          <div className="text-[10px] text-stone-500 font-bold">평균 만족도 별점</div>
                          <div className="text-xl font-black text-teal-800">★ {calcAvgRating()} / 5.0</div>
                        </div>
                      </div>

                      <div className="p-2.5 bg-stone-50 rounded-xl border border-stone-200 shrink-0">
                        <div className="text-[11px] font-bold text-stone-600 mb-1.5">결과 유형별 반응 수</div>
                        <div className="grid grid-cols-4 gap-1 text-center text-[10px]">
                          {Object.entries(calcTypeCounts()).map(([tKey, count]) => (
                            <div key={tKey} className="p-1.5 rounded bg-white border border-stone-200 font-semibold">
                              <span className="block text-stone-500">{tKey}</span>
                              <span className="font-extrabold text-[#007042]">{count}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="flex-1 min-h-0 overflow-y-auto border border-stone-200 rounded-xl p-2 space-y-2 bg-stone-50">
                        <div className="text-[11px] font-bold text-stone-600 mb-1 px-1">최근 피드백 목록 ({adminFeedbacks.length})</div>
                        {adminFeedbacks.length === 0 ? (
                          <div className="text-center py-6 text-xs text-stone-400">수집된 피드백 데이터가 아직 없습니다.</div>
                        ) : (
                          adminFeedbacks.map((item) => (
                            <div key={item.id} className="p-2.5 rounded-lg bg-white border border-stone-200 text-xs space-y-1 shadow-2xs">
                              <div className="flex items-center justify-between">
                                <span className="font-bold text-[#1E3A2B]">{item.nickname}</span>
                                <span className="text-[10px] font-bold text-[#007042] bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200">
                                  ★ {item.rating}점 | {item.result_type}
                                </span>
                              </div>
                              {item.comment && (
                                <p className="text-stone-700 font-medium text-[11px] bg-stone-50 p-1.5 rounded border border-stone-100">
                                  "{item.comment}"
                                </p>
                              )}
                              <div className="text-[9px] text-stone-400 text-right">
                                {new Date(item.created_at).toLocaleString()}
                              </div>
                            </div>
                          ))
                        )}
                      </div>

                      <div className="flex gap-2 shrink-0 pt-2 border-t border-stone-200">
                        <button
                          onClick={() => exportFeedbacksToCSV(adminFeedbacks)}
                          disabled={adminFeedbacks.length === 0}
                          className="flex-1 py-2.5 px-3 rounded-xl bg-[#007042] hover:bg-[#1E3A2B] text-white text-xs font-bold disabled:bg-stone-200 disabled:text-stone-400 transition-all flex items-center justify-center gap-1"
                        >
                          <span>📥 CSV 다운로드</span>
                        </button>
                        <button
                          onClick={() => {
                            if (window.confirm('정말로 수집된 피드백 데이터를 초기화하시겠습니까?')) {
                              clearFeedbacks();
                              setAdminFeedbacks([]);
                              triggerToast('🗑️ 피드백 데이터가 초기화되었습니다.');
                            }
                          }}
                          className="py-2.5 px-3 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs font-bold transition-all"
                        >
                          초기화
                        </button>
                      </div>

                    </div>
                  </div>
                )}

              </div>
            )}

          </div>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error("React Error Boundary caught an error:", error, errorInfo);
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-4 bg-[#FAF7F2]">
              <div className="bg-white p-6 rounded-2xl shadow-xl border border-stone-300 max-w-sm text-center space-y-3">
                <div className="text-3xl">☕</div>
                <h2 className="text-base font-black text-stone-900">Seat Your Opportunity</h2>
                <p className="text-xs text-stone-600">
                  화면 표시 중 일시적인 오류가 발생했습니다. 아래 버튼을 눌러 테스트를 다시 시작해 주세요.
                </p>
                <button
                  onClick={() => {
                    this.setState({ hasError: false });
                    window.location.reload();
                  }}
                  className="w-full py-2.5 px-4 rounded-xl bg-[#007042] text-white text-xs font-bold shadow-md hover:bg-[#1E3A2B] transition-all"
                >
                  🔄 테스트 다시 시작하기
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <ErrorBoundary>
        <CareerCafeApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
